<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket AI</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://js.puter.com/v2/"></script>

  <style>
    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
    }

    #newChat {
      background:#272933;
      color:white;
      border:0;
      border-radius:10px;
      padding:9px 12px;
      font-size:14px;
    }

    .message {
      white-space:normal;
    }

    .message p {
      margin:0 0 8px;
    }

    .message p:last-child {
      margin-bottom:0;
    }

    .typing {
      opacity:.7;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <span>🤖 Pocket AI</span>
    <button id="newChat">＋ New Chat</button>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Created by Paras Dahake</p>
    </div>
  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Message Pocket AI..."
      autocomplete="off"
    >
    <button id="sendButton">➤</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const newChat = document.getElementById("newChat");

    // Saved conversation
    let messages = JSON.parse(
      localStorage.getItem("pocketAI_messages") || "[]"
    );

    // Long-term browser memory
    let memories = JSON.parse(
      localStorage.getItem("pocketAI_memories") || "[]"
    );

    function escapeHTML(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatText(text) {
      let safe = escapeHTML(text);

      safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      safe = safe.replace(/\n/g, "<br>");

      return safe;
    }

    function addMessage(text, type) {
      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      const message = document.createElement("div");

      message.className = "message " + type;
      message.innerHTML = formatText(text);

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function saveMessages() {
      localStorage.setItem(
        "pocketAI_messages",
        JSON.stringify(messages)
      );
    }

    function saveMemories() {
      localStorage.setItem(
        "pocketAI_memories",
        JSON.stringify(memories)
      );
    }

    function loadMessages() {
      if (!messages.length) return;

      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      messages.forEach(item => {
        addMessage(
          item.content,
          item.role === "user" ? "user" : "ai"
        );
      });
    }

    // Automatically remember simple personal facts
    function detectMemory(text) {
      const lower = text.toLowerCase();

      const patterns = [
        /my name is (.+)/i,
        /i am called (.+)/i,
        /i'm called (.+)/i,
        /i like (.+)/i,
        /i love (.+)/i,
        /my favorite (.+)/i,
        /remember that (.+)/i,
        /remember this (.+)/i,
        /माझं नाव (.+)/i,
        /माझे नाव (.+)/i,
        /मला (.+) आवडतं/i,
        /मुझे (.+) पसंद है/i,
        /मेरा नाम (.+) है/i
      ];

      for (const pattern of patterns) {
        const match = text.match(pattern);

        if (match && match[1]) {
          const memory = match[0].trim();

          if (
            memory.length > 2 &&
            !memories.some(
              item => item.toLowerCase() === memory.toLowerCase()
            )
          ) {
            memories.push(memory);
            saveMemories();
          }

          break;
        }
      }
    }

    function buildMemoryContext() {
      if (!memories.length) {
        return "No saved personal memories yet.";
      }

      return memories
        .slice(-20)
        .map((memory, index) =>
          `${index + 1}. ${memory}`
        )
        .join("\n");
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || sendButton.disabled) {
        return;
      }

      addMessage(text, "user");

      messages.push({
        role: "user",
        content: text
      });

      detectMemory(text);

      saveMessages();

      input.value = "";
      sendButton.disabled = true;

      const thinking = addMessage(
        "Thinking...",
        "ai"
      );

      thinking.classList.add("typing");

      try {
        const systemPrompt = `
You are Pocket AI, a helpful, friendly and intelligent AI assistant created by Paras Dahake.

Match the user's language naturally.
You can communicate in English, Hindi, Marathi, or mixed language.

Use the saved memory below when it is relevant.
Do not mention the memory system unless the user asks about it.

Saved memories:
${buildMemoryContext()}

Give clear, useful and natural answers.
`;

        const response = await puter.ai.chat([
          {
            role: "system",
            content: systemPrompt
          },
          ...messages
        ]);

        let answer = "";

        if (typeof response === "string") {
          answer = response;
        } else if (
          response &&
          response.message
        ) {
          answer =
            response.message.content || "";
        } else {
          answer = String(response || "");
        }

        thinking.remove();

        addMessage(answer, "ai");

        messages.push({
          role: "assistant",
          content: answer
        });

        saveMessages();

      } catch (error) {
        thinking.textContent =
          "Sorry, I couldn't respond right now. Please try again.";
      }

      sendButton.disabled = false;
      input.focus();
    }

    newChat.addEventListener(
      "click",
      function() {
        messages = [];

        localStorage.removeItem(
          "pocketAI_messages"
        );

        location.reload();
      }
    );

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    );

    loadMessages();
    input.focus();
  </script>

</body>
</html>
