<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket AI</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://js.puter.com/v2/"></script>

  <style>
    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
    }

    .top-actions {
      display:flex;
      gap:8px;
      align-items:center;
    }

    #newChat,
    #historyButton {
      background:#272933;
      color:white;
      border:0;
      border-radius:10px;
      padding:9px 12px;
      font-size:14px;
    }

    #historyButton {
      font-size:18px;
    }

    .message {
      white-space:normal;
    }

    .message p {
      margin:0 0 8px;
    }

    .message p:last-child {
      margin-bottom:0;
    }

    .typing {
      opacity:.7;
    }

    /* History panel */
    #historyPanel {
      position:fixed;
      top:0;
      left:-310px;
      width:290px;
      height:100%;
      background:#17181e;
      z-index:1000;
      transition:left .25s ease;
      box-shadow:4px 0 20px rgba(0,0,0,.35);
      overflow-y:auto;
    }

    #historyPanel.open {
      left:0;
    }

    .history-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px;
      border-bottom:1px solid #30313a;
      color:white;
      font-size:20px;
      font-weight:bold;
    }

    #closeHistory {
      background:none;
      border:0;
      color:white;
      font-size:25px;
    }

    #historyList {
      padding:10px;
    }

    .history-item {
      width:100%;
      box-sizing:border-box;
      background:#24262f;
      color:white;
      border:0;
      border-radius:10px;
      padding:13px;
      margin-bottom:8px;
      text-align:left;
      font-size:15px;
    }

    .history-item:active {
      background:#333641;
    }

    .empty-history {
      color:#999;
      text-align:center;
      padding:30px 15px;
    }

    #historyOverlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:999;
      display:none;
    }

    #historyOverlay.open {
      display:block;
    }
  </style>
</head>

<body>

  <!-- History panel -->
  <div id="historyOverlay"></div>

  <aside id="historyPanel">
    <div class="history-header">
      <span>🗂️ Chat History</span>
      <button id="closeHistory">×</button>
    </div>

    <div id="historyList"></div>
  </aside>

  <header class="topbar">
    <span>🤖 Pocket AI</span>

    <div class="top-actions">
      <button id="historyButton">🗂️</button>
      <button id="newChat">＋ New Chat</button>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Created by Paras Dahake</p>
    </div>
  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Message Pocket AI..."
      autocomplete="off"
    >

    <button id="sendButton">➤</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const newChat = document.getElementById("newChat");

    const historyButton =
      document.getElementById("historyButton");

    const historyPanel =
      document.getElementById("historyPanel");

    const historyOverlay =
      document.getElementById("historyOverlay");

    const closeHistory =
      document.getElementById("closeHistory");

    const historyList =
      document.getElementById("historyList");

    /* =========================
       CHAT HISTORY
    ========================= */

    let chats = JSON.parse(
      localStorage.getItem("pocketAI_chats") || "[]"
    );

    let currentChatId =
      localStorage.getItem("pocketAI_current_chat");

    /* =========================
       MEMORY
    ========================= */

    let memories = JSON.parse(
      localStorage.getItem("pocketAI_memories") || "[]"
    );

    function createChat() {
      const id =
        Date.now().toString();

      const newConversation = {
        id: id,
        title: "New Chat",
        messages: []
      };

      chats.unshift(newConversation);

      currentChatId = id;

      saveChats();

      return newConversation;
    }

    function getCurrentChat() {
      return chats.find(
        item => item.id === currentChatId
      );
    }

    function saveChats() {
      localStorage.setItem(
        "pocketAI_chats",
        JSON.stringify(chats)
      );

      localStorage.setItem(
        "pocketAI_current_chat",
        currentChatId || ""
      );
    }

    function migrateOldChat() {
      const oldMessages = JSON.parse(
        localStorage.getItem("pocketAI_messages") || "[]"
      );

      if (
        chats.length === 0 &&
        oldMessages.length > 0
      ) {
        const migrated = {
          id: Date.now().toString(),
          title: oldMessages[0]?.content
            ? oldMessages[0].content.slice(0, 35)
            : "Previous Chat",
          messages: oldMessages
        };

        chats.push(migrated);

        currentChatId = migrated.id;

        saveChats();

        localStorage.removeItem(
          "pocketAI_messages"
        );
      }
    }

    migrateOldChat();

    if (!getCurrentChat()) {
      createChat();
    }

    /* =========================
       TEXT FORMATTING
    ========================= */

    function escapeHTML(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatText(text) {
      let safe = escapeHTML(text);

      safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      safe = safe.replace(
        /\n/g,
        "<br>"
      );

      return safe;
    }

    /* =========================
       DISPLAY MESSAGE
    ========================= */

    function addMessage(text, type) {
      const welcome =
        document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.innerHTML =
        formatText(text);

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;
    }

    function loadCurrentChat() {
      chat.innerHTML = "";

      const current =
        getCurrentChat();

      if (
        !current ||
        current.messages.length === 0
      ) {
        chat.innerHTML = `
          <div class="welcome" id="welcome">
            <h1>How can I help you?</h1>
            <p>Created by Paras Dahake</p>
          </div>
        `;

        return;
      }

      current.messages.forEach(item => {
        addMessage(
          item.content,
          item.role === "user"
            ? "user"
            : "ai"
        );
      });
    }

    /* =========================
       MEMORY
    ========================= */

    function saveMemories() {
      localStorage.setItem(
        "pocketAI_memories",
        JSON.stringify(memories)
      );
    }

    function detectMemory(text) {
      const patterns = [
        /my name is (.+)/i,
        /i am called (.+)/i,
        /i'm called (.+)/i,
        /i like (.+)/i,
        /i love (.+)/i,
        /my favorite (.+)/i,
        /remember that (.+)/i,
        /remember this (.+)/i,
        /माझं नाव (.+)/i,
        /माझे नाव (.+)/i,
        /मला (.+) आवडतं/i,
        /मुझे (.+) पसंद है/i,
        /मेरा नाम (.+) है/i
      ];

      for (const pattern of patterns) {
        const match =
          text.match(pattern);

        if (
          match &&
          match[0] &&
          match[0].trim().length > 2
        ) {
          const memory =
            match[0].trim();

          const exists =
            memories.some(
              item =>
                item.toLowerCase() ===
                memory.toLowerCase()
            );

          if (!exists) {
            memories.push(memory);
            saveMemories();
          }

          break;
        }
      }
    }

    function buildMemoryContext() {
      if (!memories.length) {
        return "No saved personal memories yet.";
      }

      return memories
        .slice(-20)
        .map(
          (memory, index) =>
            `${index + 1}. ${memory}`
        )
        .join("\n");
    }

    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {
      const text =
        input.value.trim();

      if (
        !text ||
        sendButton.disabled
      ) {
        return;
      }

      const current =
        getCurrentChat();

      if (!current) {
        return;
      }

      addMessage(text, "user");

      current.messages.push({
        role: "user",
        content: text
      });

      if (
        current.title === "New Chat"
      ) {
        current.title =
          text.slice(0, 35);
      }

      detectMemory(text);

      saveChats();

      input.value = "";

      sendButton.disabled = true;

      const thinking =
        addMessage(
          "Thinking...",
          "ai"
        );

      thinking.classList.add(
        "typing"
      );

      try {
        const systemPrompt = `
You are Pocket AI, a helpful, friendly and intelligent AI assistant created by Paras Dahake.

Match the user's language naturally.

You can communicate in English, Hindi, Marathi, or mixed language.

Use the saved memory below when relevant.

Do not mention the memory system unless the user asks about it.

Saved memories:
${buildMemoryContext()}

Give clear, useful and natural answers.
`;

        const response =
          await puter.ai.chat([
            {
              role: "system",
              content: systemPrompt
            },
            ...current.messages
          ]);

        let answer = "";

        if (
          typeof response === "string"
        ) {
          answer = response;
        } else if (
          response &&
          response.message
        ) {
          answer =
            response.message.content || "";
        } else {
          answer =
            String(response || "");
        }

        thinking.remove();

        addMessage(
          answer,
          "ai"
        );

        current.messages.push({
          role: "assistant",
          content: answer
        });

        saveChats();

        renderHistory();

      } catch (error) {
        thinking.textContent =
          "Sorry, I couldn't respond right now. Please try again.";
      }

      sendButton.disabled = false;

      input.focus();
    }

    /* =========================
       NEW CHAT
    ========================= */

    newChat.addEventListener(
      "click",
      function() {
        createChat();

        loadCurrentChat();

        renderHistory();

        closeHistoryPanel();

        input.focus();
      }
    );

    /* =========================
       CHAT HISTORY UI
    ========================= */

    function renderHistory() {
      historyList.innerHTML = "";

      if (!chats.length) {
        historyList.innerHTML =
          '<div class="empty-history">No chats yet.</div>';

        return;
      }

      chats.forEach(item => {
        const button =
          document.createElement("button");

        button.className =
          "history-item";

        button.textContent =
          item.title || "New Chat";

        button.addEventListener(
          "click",
          function() {
            currentChatId =
              item.id;

            saveChats();

            loadCurrentChat();

            closeHistoryPanel();

            input.focus();
          }
        );

        historyList.appendChild(
          button
        );
      });
    }

    function openHistoryPanel() {
      historyPanel.classList.add(
        "open"
      );

      historyOverlay.classList.add(
        "open"
      );

      renderHistory();
    }

    function closeHistoryPanel() {
      historyPanel.classList.remove(
        "open"
      );

      historyOverlay.classList.remove(
        "open"
      );
    }

    historyButton.addEventListener(
      "click",
      openHistoryPanel
    );

    closeHistory.addEventListener(
      "click",
      closeHistoryPanel
    );

    historyOverlay.addEventListener(
      "click",
      closeHistoryPanel
    );

    /* =========================
       ENTER TO SEND
    ========================= */

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Enter"
        ) {
          sendMessage();
        }
      }
    );

    /* =========================
       START
    ========================= */

    loadCurrentChat();

    renderHistory();

    input.focus();
  </script>

</body>
</html>
