<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Limitra AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#0b0c10;--panel:#12141a;--panel2:#181b23;--text:#f4f5f7;--muted:#9aa0ad;--line:#272b35;--accent:#7c5cff;--user:#25202f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}header{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#101116}
.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-weight:800}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px}
.header-actions{display:flex;gap:7px}.icon-btn,.tool-btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px;cursor:pointer;color:var(--text)}
main{min-height:0;flex:1;display:flex;position:relative}#chat{flex:1;overflow:auto;padding:22px 14px 140px}.welcome{max-width:720px;margin:12vh auto 0;text-align:center;padding:24px}.welcome h2{font-size:32px;margin:0 0 8px}.welcome p{color:var(--muted)}
.message{max-width:820px;margin:0 auto 14px;display:flex;gap:9px;align-items:flex-start}.message.user{justify-content:flex-end}.bubble{max-width:min(86%,720px);border:1px solid var(--line);border-radius:17px;padding:12px 14px;line-height:1.52;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user);border-bottom-right-radius:5px}.assistant .bubble{background:var(--panel);border-bottom-left-radius:5px}.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:800}.message-tools{display:flex;gap:5px;margin-top:6px}.message-tools button{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 12px;background:linear-gradient(transparent,var(--bg) 25%)}.composer{max-width:900px;margin:auto;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:8px;box-shadow:0 8px 40px #0007}.row{display:flex;gap:7px;align-items:flex-end}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);min-height:44px;max-height:140px;padding:11px 9px}.send{width:46px;height:46px;border:0;border-radius:14px;background:var(--accent);cursor:pointer;font-weight:800}.send:disabled{opacity:.45;cursor:not-allowed}.composer-tools{display:flex;gap:6px;align-items:center;padding:3px 4px 1px}.tool-btn{font-size:12px;padding:7px 9px}.status{font-size:11px;color:var(--muted);margin-left:auto}.error{color:#ff9ba5}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}.modal-card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.modal-card h3{margin-top:0}.modal-card p{color:var(--muted);line-height:1.5}.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
@media(min-width:700px){#chat{padding-left:28px;padding-right:28px}.composer-wrap{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">L</div><div><h1>Limitra AI</h1><small>AI assistant by Paras Dahake</small></div></div><div class="header-actions"><button class="icon-btn" id="newChat">＋</button><button class="icon-btn" id="settingsBtn">⚙</button></div></header>
<main><section id="chat" aria-live="polite"><div class="welcome" id="welcome"><h2>How can I help?</h2><p>Ask Limitra AI anything.</p></div></section>
<div class="composer-wrap"><div class="composer"><div class="row"><textarea id="input" rows="1" placeholder="Message Limitra AI…" autocomplete="off"></textarea><button class="send" id="send">➤</button></div><div class="composer-tools"><button class="tool-btn" id="mic">🎙 Voice</button><button class="tool-btn" id="speakToggle">🔊 Voice: Off</button><span class="status" id="status">Ready</span></div></div></div></main></div>
<div class="modal" id="settingsModal"><div class="modal-card"><h3>Limitra AI settings</h3><div class="setting"><span>Voice input language</span><select id="voiceLang"><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option><option value="mr-IN">मराठी</option></select></div><div class="setting"><span>Keep chats on this device</span><input id="persist" type="checkbox" checked></div><p>This foundation is modular so future features can plug into the same chat, state, storage and tool layers.</p><button class="tool-btn" id="closeSettings">Close</button></div></div>
<script>
const CONFIG={appName:"Limitra AI",creator:"Paras Dahake",model:"gpt-5.6-luna",storageKey:"limitra-ai-state-v2",maxHistoryForModel:30,requestTimeoutMs:45000};
const state={messages:[],busy:false,voiceOutput:false,voiceLanguage:localStorage.getItem("limitra-voice-lang")||"en-IN",persist:localStorage.getItem("limitra-persist")!=="false",modules:new Map()};
const $=id=>document.getElementById(id),chat=$("chat"),input=$("input"),send=$("send"),status=$("status");
function setStatus(t,e=false){status.textContent=t;status.className="status"+(e?" error":"")}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){ $("welcome").style.display=state.messages.length?"none":"";chat.querySelectorAll(".message").forEach(x=>x.remove());for(const m of state.messages){const r=document.createElement("div");r.className="message "+m.role;if(m.role==="assistant")r.innerHTML=`<div class="avatar">L</div><div><div class="bubble">${esc(m.content)}</div><div class="message-tools"><button data-speak="${m.id}">🔊 Speak</button></div></div>`;else r.innerHTML=`<div class="bubble">${esc(m.content)}</div>`;chat.appendChild(r)}chat.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>{const m=state.messages.find(x=>x.id===b.dataset.speak);if(m)speak(m.content)});chat.scrollTop=chat.scrollHeight;save()}
function addMessage(role,content){state.messages.push({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),role,content});render()}
function buildPrompt(){return[{role:"system",content:`You are ${CONFIG.appName}, a helpful AI assistant created by ${CONFIG.creator}. Respond naturally in the language the user uses, including English, Hindi, Marathi and mixed language. Be clear, useful, friendly and honest.`},...state.messages.slice(-CONFIG.maxHistoryForModel).map(m=>({role:m.role,content:m.content}))]}
async function timeout(p,ms){let t;const q=new Promise((_,r)=>t=setTimeout(()=>r(new Error("Request timed out. Please try again.")),ms));try{return await Promise.race([p,q])}finally{clearTimeout(t)}}
function answer(r){if(typeof r==="string")return r.trim();const c=r?.message?.content;if(typeof c==="string")return c.trim();if(Array.isArray(c))return c.map(x=>typeof x==="string"?x:x?.text||"").join("").trim();return (r?.text||r?.content||"").toString().trim()}
async function askAI(){if(!input.value.trim()||state.busy)return;const text=input.value.trim();input.value="";resize();addMessage("user",text);state.busy=true;send.disabled=true;setStatus("Limitra AI is thinking…");const id=crypto.randomUUID?.()||String(Date.now());state.messages.push({id,role:"assistant",content:"Limitra AI thinking…"});render();try{if(!window.puter?.ai?.chat)throw new Error("Puter AI is not available. Check your internet connection and reload.");const r=await timeout(puter.ai.chat(buildPrompt(),{model:CONFIG.model,normalize:true}),CONFIG.requestTimeoutMs),a=answer(r);if(!a)throw new Error("Limitra AI returned an empty response.");const i=state.messages.findIndex(m=>m.id===id);if(i>=0)state.messages[i].content=a;render();setStatus("Ready");if(state.voiceOutput)speak(a)}catch(e){const i=state.messages.findIndex(m=>m.id===id),msg="I couldn't complete that request. "+(e?.message||"Unknown error.");if(i>=0)state.messages[i].content=msg;render();setStatus("Error — try again",true);console.error("Limitra AI:",e)}finally{state.busy=false;send.disabled=false}}
function save(){if(!state.persist)return;localStorage.setItem(CONFIG.storageKey,JSON.stringify({messages:state.messages.slice(-100),voiceOutput:state.voiceOutput,voiceLanguage:state.voiceLanguage,persist:state.persist}))}
function load(){try{const r=JSON.parse(localStorage.getItem(CONFIG.storageKey)||"null");if(r){state.messages=Array.isArray(r.messages)?r.messages:[];state.voiceOutput=!!r.voiceOutput;state.voiceLanguage=r.voiceLanguage||state.voiceLanguage;state.persist=r.persist!==false}}catch(e){}}
let recognition=null;function setupSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("mic").disabled=true;return}recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang=state.voiceLanguage;recognition.onstart=()=>setStatus("Listening…");recognition.onresult=e=>{let f="";for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)f+=e.results[i][0].transcript;if(f){input.value+=(input.value?" ":"")+f;resize()}};recognition.onerror=e=>setStatus("Voice: "+e.error,true);recognition.onend=()=>{if(!state.busy)setStatus("Ready")}}
$("mic").onclick=()=>{if(recognition){recognition.lang=state.voiceLanguage;try{recognition.start()}catch(e){}}};
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":"en-IN";speechSynthesis.speak(u)}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"}
input.oninput=resize;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();askAI()}};send.onclick=askAI;
$("newChat").onclick=()=>{if(!state.busy){state.messages=[];render();setStatus("New chat")}};
$("speakToggle").onclick=()=>{state.voiceOutput=!state.voiceOutput;$("speakToggle").textContent=state.voiceOutput?"🔊 Voice: On":"🔊 Voice: Off";save()};
$("settingsBtn").onclick=()=>$("settingsModal").classList.add("open");$("closeSettings").onclick=()=>$("settingsModal").classList.remove("open");
$("voiceLang").onchange=e=>{state.voiceLanguage=e.target.value;localStorage.setItem("limitra-voice-lang",state.voiceLanguage);if(recognition)recognition.lang=state.voiceLanguage};
$("persist").onchange=e=>{state.persist=e.target.checked;localStorage.setItem("limitra-persist",String(state.persist));if(!state.persist)localStorage.removeItem(CONFIG.storageKey);else save()};
function registerModule(name,api){state.modules.set(name,api)}
window.LimitraAI={config:CONFIG,state,registerModule,addMessage,speak,askAI};
load();$("voiceLang").value=state.voiceLanguage;$("persist").checked=state.persist;$("speakToggle").textContent=state.voiceOutput?"🔊 Voice: On":"🔊 Voice: Off";setupSpeech();render();
</script>
</body>
</html>
