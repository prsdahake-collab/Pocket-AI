<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Pocket AI</title>

        <meta name="theme-color" content="#0f1014">

          <script src="https://js.puter.com/v2/"></script>

            <style>
                * {
                      box-sizing: border-box;
                          }

                              body {
                                    margin: 0;
                                          background: #0f1014;
                                                color: white;
                                                      font-family: Arial, sans-serif;
                                                            height: 100vh;
                                                                  overflow: hidden;
                                                                      }

                                                                          header {
                                                                                height: 70px;
                                                                                      background: #191a20;
                                                                                            display: flex;
                                                                                                  align-items: center;
                                                                                                        justify-content: center;
                                                                                                              font-size: 30px;
                                                                                                                    font-weight: bold;
                                                                                                                          border-bottom: 1px solid #30313a;
                                                                                                                              }

                                                                                                                                  .robot {
                                                                                                                                        margin-right: 10px;
                                                                                                                                            }

                                                                                                                                                #chat {
                                                                                                                                                      height: calc(100vh - 140px);
                                                                                                                                                            overflow-y: auto;
                                                                                                                                                                  padding: 25px 18px 30px;
                                                                                                                                                                      }

                                                                                                                                                                          .message {
                                                                                                                                                                                max-width: 85%;
                                                                                                                                                                                      margin-bottom: 16px;
                                                                                                                                                                                            padding: 13px 16px;
                                                                                                                                                                                                  border-radius: 18px;
                                                                                                                                                                                                        line-height: 1.5;
                                                                                                                                                                                                              font-size: 17px;
                                                                                                                                                                                                                    white-space: pre-wrap;
                                                                                                                                                                                                                          word-wrap: break-word;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                  .user {
                                                                                                                                                                                                                                        margin-left: auto;
                                                                                                                                                                                                                                              background: #315cff;
                                                                                                                                                                                                                                                    border-bottom-right-radius: 5px;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                            .ai {
                                                                                                                                                                                                                                                                  margin-right: auto;
                                                                                                                                                                                                                                                                        background: #242630;
                                                                                                                                                                                                                                                                              border-bottom-left-radius: 5px;
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                      .welcome {
                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                  margin-top: 25vh;
                                                                                                                                                                                                                                                                                                        color: #bfc1cc;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                .welcome h1 {
                                                                                                                                                                                                                                                                                                                      color: white;
                                                                                                                                                                                                                                                                                                                            font-size: 30px;
                                                                                                                                                                                                                                                                                                                                  margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                          .welcome p {
                                                                                                                                                                                                                                                                                                                                                font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                        .input-area {
                                                                                                                                                                                                                                                                                                                                                              position: fixed;
                                                                                                                                                                                                                                                                                                                                                                    bottom: 0;
                                                                                                                                                                                                                                                                                                                                                                          left: 0;
                                                                                                                                                                                                                                                                                                                                                                                right: 0;
                                                                                                                                                                                                                                                                                                                                                                                      height: 70px;
                                                                                                                                                                                                                                                                                                                                                                                            background: #191a20;
                                                                                                                                                                                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                              gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 10px 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                          border-top: 1px solid #30313a;
                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                  #messageInput {
                                                                                                                                                                                                                                                                                                                                                                                                                                        flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                              height: 48px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          outline: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 25px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 0 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #272933;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                #messageInput::placeholder {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #9295a3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                height: 48px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      min-width: 48px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #315cff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button:active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            transform: scale(0.95);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    #sendButton {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 22px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <span class="robot">🤖</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Pocket AI
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <main id="chat">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="welcome" id="welcome">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>How can I help you?</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>Ask Pocket AI anything.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="input-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                id="messageInput"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="Message Pocket AI..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  autocomplete="off"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button id="sendButton">➤</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const chat = document.getElementById("chat");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const input = document.getElementById("messageInput");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const sendButton = document.getElementById("sendButton");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const welcome = document.getElementById("welcome");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function addMessage(text, type) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (welcome) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                welcome.remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const message = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.className = "message " + type;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.textContent = text;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              chat.appendChild(message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    chat.scrollTop = chat.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  async function sendMessage() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const text = input.value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!text) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    addMessage(text, "user");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          input.value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const thinking = addMessage("Thinking...", "ai");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const response = await puter.ai.chat(text);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      thinking.remove();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let answer = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (typeof response === "string") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                answer = response;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else if (response && response.message) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  answer = response.message.content || "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    answer = String(response);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    addMessage(answer || "I couldn't generate a response.", "ai");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  thinking.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Sorry, something went wrong. Please try again.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          sendButton.addEventListener("click", sendMessage);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              input.addEventListener("keydown", function(event) {
