<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket AI</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f1014;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      min-height: 64px;
      background: #191a20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #292b33;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .action-btn {
      background: #272933;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
    }

    .action-btn:active {
      transform: scale(.97);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px 130px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 700px;
      margin: 55px auto 0;
      text-align: center;
      padding: 20px;
    }

    .robot {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .welcome p {
      margin: 0;
      color: #aeb1bd;
      font-size: 16px;
    }

    .message-row {
      display: flex;
      margin: 10px auto;
      max-width: 850px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.bot {
      justify-content: flex-start;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 16px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .user .message {
      background: #30323d;
      border-bottom-right-radius: 5px;
    }

    .bot .message {
      background: #1b1d24;
      border: 1px solid #292b34;
      border-bottom-left-radius: 5px;
    }

    .message h1,
    .message h2,
    .message h3 {
      margin-top: 5px;
      margin-bottom: 8px;
    }

    .message p {
      margin: 6px 0;
    }

    .message ul,
    .message ol {
      padding-left: 24px;
      margin: 8px 0;
    }

    .message li {
      margin: 4px 0;
    }

    .message strong {
      font-weight: 800;
    }

    .message code {
      background: #111218;
      padding: 2px 5px;
      border-radius: 5px;
    }

    .message pre {
      background: #0b0c10;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .generated-image {
      width: 100%;
      max-width: 620px;
      display: block;
      border-radius: 14px;
      margin-top: 5px;
    }

    .image-caption {
      color: #aeb1bd;
      font-size: 13px;
      margin-top: 8px;
    }

    .typing {
      color: #aeb1bd;
      font-style: italic;
    }

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        transparent,
        #0f1014 25%
      );
      padding: 25px 12px 14px;
    }

    .mode-label {
      max-width: 850px;
      margin: 0 auto 6px;
      color: #aeb1bd;
      font-size: 13px;
      padding-left: 5px;
      display: none;
    }

    .mode-label.active {
      display: block;
    }

    .composer {
      max-width: 850px;
      margin: auto;
      background: #191a20;
      border: 1px solid #30323b;
      border-radius: 17px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      gap: 7px;
      box-shadow: 0 8px 35px rgba(0,0,0,.35);
    }

    #input {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 130px;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 11px 9px;
      font-size: 16px;
      font-family: inherit;
    }

    #input::placeholder {
      color: #777b88;
    }

    #sendButton {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: #ffffff;
      color: #111218;
      font-size: 19px;
      font-weight: bold;
    }

    #sendButton:disabled {
      opacity: .45;
    }

    .image-mode {
      background: #6d4aff !important;
      color: white !important;
    }

    .panel {
      position: fixed;
      top: 72px;
      right: 10px;
      width: min(340px, calc(100vw - 20px));
      max-height: 70vh;
      overflow-y: auto;
      background: #191a20;
      border: 1px solid #30323b;
      border-radius: 15px;
      padding: 12px;
      z-index: 20;
      box-shadow: 0 15px 45px rgba(0,0,0,.5);
      display: none;
    }

    .panel.open {
      display: block;
    }

    .panel h3 {
      margin: 5px 5px 12px;
    }

    .history-item {
      background: #24262f;
      padding: 10px;
      border-radius: 10px;
      margin: 6px 0;
      cursor: pointer;
      font-size: 14px;
    }

    .history-item:active {
      transform: scale(.98);
    }

    .empty-history {
      color: #9296a3;
      padding: 10px 5px;
      font-size: 14px;
    }

    .clear-btn {
      width: 100%;
      margin-top: 8px;
      background: #30323d;
      color: white;
      border: 0;
      padding: 10px;
      border-radius: 9px;
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 25px;
      }

      .action-btn {
        padding: 8px 9px;
      }

      .message {
        max-width: 90%;
      }

      #chat {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">Pocket AI</div>

    <div class="top-actions">
      <button class="action-btn" id="imageButton" title="Image Generation">🎨</button>
      <button class="action-btn" id="historyButton" title="Chat History">🗂️</button>
      <button class="action-btn" id="newChat">New Chat</button>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <div class="robot">🤖</div>
      <h1>Hi, I'm Pocket AI</h1>
      <p>Ask me anything.</p>
    </div>
  </main>

  <div class="panel" id="historyPanel">
    <h3>🗂️ Chat History</h3>
    <div id="historyList"></div>
    <button class="clear-btn" id="clearHistory">Clear History</button>
  </div>

  <div class="composer-area">

    <div class="mode-label" id="modeLabel">
      🎨 Image Generation Mode
    </div>

    <div class="composer">
      <textarea
        id="input"
        placeholder="Message Pocket AI..."
        rows="1"
      ></textarea>

      <button id="sendButton" title="Send">➤</button>
    </div>

  </div>

</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("sendButton");
  const newChatButton = document.getElementById("newChat");
  const historyButton = document.getElementById("historyButton");
  const historyPanel = document.getElementById("historyPanel");
  const historyList = document.getElementById("historyList");
  const clearHistory = document.getElementById("clearHistory");
  const imageButton = document.getElementById("imageButton");
  const modeLabel = document.getElementById("modeLabel");
  const welcome = document.getElementById("welcome");

  let imageMode = false;
  let currentChat = [];
  let isBusy = false;

  const MEMORY_KEY = "pocket_ai_memory";
  const HISTORY_KEY = "pocket_ai_history";
  const CURRENT_CHAT_KEY = "pocket_ai_current_chat";

  function getMemory() {
    try {
      return JSON.parse(localStorage.getItem(MEMORY_KEY) || "{}");
    } catch {
      return {};
    }
  }

  function saveMemory(memory) {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
  }

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function saveHistory(history) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function formatMarkdown(text) {
    let html = escapeHtml(text);

    html = html.replace(
      /```([\s\S]*?)```/g,
      "<pre><code>$1</code></pre>"
    );

    html = html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

    html = html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

    html = html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );

    html = html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

    html = html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

    html = html.replace(
      /^\s*[-*]\s+(.*)$/gm,
      "<li>$1</li>"
    );

    html = html.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );

    html = html.replace(
      /\n\n+/g,
      "</p><p>"
    );

    html = "<p>" + html + "</p>";

    html = html.replace(
      /<p>(<h[1-3]>)/g,
      "$1"
    );

    html = html.replace(
      /(<\/h[1-3]>)<\/p>/g,
      "$1"
    );

    html = html.replace(
      /<p>(<ul>)/g,
      "$1"
    );

    html = html.replace(
      /(<\/ul>)<\/p>/g,
      "$1"
    );

    html = html.replace(
      /<p><pre>/g,
      "<pre>"
    );

    html = html.replace(
      /<\/pre><\/p>/g,
      "</pre>"
    );

    return html;
  }

  function addMessage(role, text, save = true) {
    if (welcome) {
      welcome.style.display = "none";
    }

    const row = document.createElement("div");
    row.className = "message-row " + role;

    const bubble = document.createElement("div");
    bubble.className = "message";

    if (role === "bot") {
      bubble.innerHTML = formatMarkdown(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(bubble);
    chat.appendChild(row);

    if (save) {
      currentChat.push({
        role: role,
        text: text,
        type: "text"
      });

      localStorage.setItem(
        CURRENT_CHAT_KEY,
        JSON.stringify(currentChat)
      );
    }

    chat.scrollTop = chat.scrollHeight;

    return bubble;
  }

  function addImageMessage(prompt, imageElement, save = true) {
    if (welcome) {
      welcome.style.display = "none";
    }

    const row = document.createElement("div");
    row.className = "message-row bot";

    const bubble = document.createElement("div");
    bubble.className = "message";

    const title = document.createElement("div");
    title.innerHTML = "<strong>🎨 Generated Image</strong>";

    imageElement.className = "generated-image";
    imageElement.alt = prompt;

    const caption = document.createElement("div");
    caption.className = "image-caption";
    caption.textContent = prompt;

    bubble.appendChild(title);
    bubble.appendChild(imageElement);
    bubble.appendChild(caption);

    row.appendChild(bubble);
    chat.appendChild(row);

    if (save) {
      currentChat.push({
        role: "bot",
        text: "🎨 Image generated: " + prompt,
        type: "image"
      });

      localStorage.setItem(
        CURRENT_CHAT_KEY,
        JSON.stringify(currentChat)
      );
    }

    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "message-row bot";
    row.id = "typingMessage";

    const bubble = document.createElement("div");
    bubble.className = "message typing";
    bubble.textContent = "Pocket AI is thinking...";

    row.appendChild(bubble);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById("typingMessage");
    if (typing) {
      typing.remove();
    }
  }

  function updateMemoryFromConversation(userText, aiText) {
    const memory = getMemory();

    const combined = (userText + " " + aiText).toLowerCase();

    const nameMatch =
      userText.match(
        /(?:my name is|i am|i'm|call me)\s+([a-zA-Z][a-zA-Z ]{1,30})/i
      );

    if (nameMatch) {
      memory.name = nameMatch[1].trim();
    }

    if (
      combined.includes("my name is paras") ||
      combined.includes("my name is paras dahake")
    ) {
      memory.name = "Paras";
    }

    memory.updatedAt = Date.now();

    saveMemory(memory);
  }

  function buildConversationMessages(userText) {
    const memory = getMemory();

    let systemPrompt =
      "You are Pocket AI, a helpful AI assistant created by Paras Dahake. " +
      "Give clear, useful and friendly answers. " +
      "Match the user's language naturally: English, Hindi, Marathi, " +
      "or mixed language. Do not force one language. " +
      "Use Markdown when it improves readability.";

    if (memory.name) {
      systemPrompt +=
        " The user's remembered name is " +
        memory.name +
        ".";
    }

    const messages = [
      {
        role: "system",
        content: systemPrompt
      }
    ];

    for (const item of currentChat.slice(-12)) {
      if (item.type === "text") {
        messages.push({
          role: item.role === "user" ? "user" : "assistant",
          content: item.text
        });
      }
    }

    messages.push({
      role: "user",
      content: userText
    });

    return messages;
  }

  async function sendChatMessage(prompt) {
    addMessage("user", prompt);
    addTyping();

    try {
      const messages = buildConversationMessages(prompt);

      const response = await puter.ai.chat(messages);

      removeTyping();

      let answer = "";

      if (typeof response === "string") {
        answer = response;
      } else if (response && response.message) {
        if (typeof response.message.content === "string") {
          answer = response.message.content;
        } else if (Array.isArray(response.message.content)) {
          answer = response.message.content
            .map(x => x.text || "")
            .join("");
        }
      }

      if (!answer) {
        answer = "I couldn't generate a response. Please try again.";
      }

      addMessage("bot", answer);

      updateMemoryFromConversation(prompt, answer);

      updateHistory();
    } catch (error) {
      removeTyping();

      addMessage(
        "bot",
        "Sorry, something went wrong while getting the AI response. Please try again."
      );

      console.error(error);
    }
  }

  async function generateImage(prompt) {
    addMessage("user", "🎨 " + prompt);
    addTyping();

    try {
      /*
        REAL IMAGE GENERATION
        This is intentionally separate from puter.ai.chat().
      */

      const image = await puter.ai.txt2img(prompt, {
        quality: "low"
      });

      removeTyping();

      if (image) {
        addImageMessage(prompt, image);
      } else {
        addMessage(
          "bot",
          "The image was not returned. Please try again."
        );
      }

      updateHistory();

    } catch (error) {
      removeTyping();

      addMessage(
        "bot",
        "I couldn't generate that image right now. Please try another prompt."
      );

      console.error(error);
    }
  }

  async function sendMessage() {
    if (isBusy) return;

    const prompt = input.value.trim();

    if (!prompt) return;

    input.value = "";
    input.style.height = "44px";

    isBusy = true;
    sendButton.disabled = true;

    if (imageMode) {
      await generateImage(prompt);
    } else {
      await sendChatMessage(prompt);
    }

    isBusy = false;
    sendButton.disabled = false;
    input.focus();
  }

  function toggleImageMode() {
    imageMode = !imageMode;

    if (imageMode) {
      imageButton.classList.add("image-mode");
      modeLabel.classList.add("active");
      input.placeholder = "Describe the image you want...";
    } else {
      imageButton.classList.remove("image-mode");
      modeLabel.classList.remove("active");
      input.placeholder = "Message Pocket AI...";
    }

    input.focus();
  }

  function startNewChat() {
    currentChat = [];

    localStorage.removeItem(CURRENT_CHAT_KEY);

    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="robot">🤖</div>
        <h1>Hi, I'm Pocket AI</h1>
        <p>Ask me anything.</p>
      </div>
    `;

    imageMode = false;
    imageButton.classList.remove("image-mode");
    modeLabel.classList.remove("active");
    input.placeholder = "Message Pocket AI...";

    historyPanel.classList.remove("open");

    input.focus();
  }

  function saveHistoryItem() {
    if (!currentChat.length) return;

    const firstUserMessage = currentChat.find(
      item => item.role === "user"
    );

    if (!firstUserMessage) return;

    const history = getHistory();

    const item = {
      id: Date.now(),
      title: firstUserMessage.text.slice(0, 60),
      messages: currentChat
    };

    history.unshift(item);

    saveHistory(history.slice(0, 30));
  }

  function updateHistory() {
    const history = getHistory();

    if (currentChat.length) {
      const firstUserMessage = currentChat.find(
        item => item.role === "user"
      );

      if (firstUserMessage) {
        const existingIndex = history.findIndex(
          item =>
            item.messages &&
            item.messages.length &&
            item.messages[0].text === firstUserMessage.text
        );

        const currentItem = {
          id: existingIndex >= 0
            ? history[existingIndex].id
            : Date.now(),
          title: firstUserMessage.text.slice(0, 60),
          messages: currentChat
        };

        if (existingIndex >= 0) {
          history[existingIndex] = currentItem;
        } else {
          history.unshift(currentItem);
        }

        saveHistory(history.slice(0, 30));
      }
    }

    renderHistory();
  }

  function renderHistory() {
    const history = getHistory();

    historyList.innerHTML = "";

    if (!history.length) {
      historyList.innerHTML =
        '<div class="empty-history">No chat history yet.</div>';
      return;
    }

    history.forEach(item => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.textContent = item.title || "Chat";

      div.addEventListener("click", () => {
        loadHistoryItem(item);
        historyPanel.classList.remove("open");
      });

      historyList.appendChild(div);
    });
  }

  function loadHistoryItem(item) {
    currentChat = item.messages || [];

    chat.innerHTML = "";

    currentChat.forEach(message => {
      if (message.type === "image") {
        addMessage(
          "bot",
          message.text +
          "\n\nThe generated image is not stored in browser history."
        , false);
      } else {
        addMessage(
          message.role,
          message.text,
          false
        );
      }
    });

    localStorage.setItem(
      CURRENT_CHAT_KEY,
      JSON.stringify(currentChat)
    );

    chat.scrollTop = chat.scrollHeight;
  }

  function loadCurrentChat() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(CURRENT_CHAT_KEY) || "[]"
      );

      if (!Array.isArray(saved) || !saved.length) {
        return;
      }

      currentChat = saved;
      chat.innerHTML = "";

      currentChat.forEach(message => {
        if (message.type === "image") {
          addMessage(
            "bot",
            message.text +
            "\n\nThe generated image is not stored in browser history.",
            false
          );
        } else {
          addMessage(
            message.role,
            message.text,
            false
          );
        }
      });
    } catch {
      currentChat = [];
    }
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "44px";
    input.style.height =
      Math.min(input.scrollHeight, 130) + "px";
  });

  imageButton.addEventListener(
    "click",
    toggleImageMode
  );

  newChatButton.addEventListener(
    "click",
    startNewChat
  );

  historyButton.addEventListener("click", () => {
    historyPanel.classList.toggle("open");
    renderHistory();
  });

  clearHistory.addEventListener("click", () => {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  });

  document.addEventListener("click", event => {
    if (
      historyPanel.classList.contains("open") &&
      !historyPanel.contains(event.target) &&
      event.target !== historyButton
    ) {
      historyPanel.classList.remove("open");
    }
  });

  loadCurrentChat();
  renderHistory();
  input.focus();
</script>

</body>
</html>
