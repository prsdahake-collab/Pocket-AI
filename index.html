<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limitra AI</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background: #0f1014;
    }

    body {
      margin: 0;
      background: #0f1014;
      color: white;
      font-family: Arial, sans-serif;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }

    .app {
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      min-height: 64px;
      background: #191a20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #292b33;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    /* Menu icon inspired by the supplied glowing circular design. */
    .menu-btn {
      position: relative;
      width: 54px;
      height: 54px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #252831 0 58%, #1a1c22 72%, #17191f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      flex: 0 0 auto;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.10),
        0 0 8px rgba(190,220,235,.16),
        0 0 18px rgba(130,190,220,.08);
      isolation: isolate;
    }

    .menu-btn::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 2px solid rgba(225, 240, 248, .72);
      border-radius: 50%;
      box-shadow:
        0 0 7px rgba(220,240,248,.48),
        inset 0 0 8px rgba(220,240,248,.10);
      pointer-events: none;
    }

    .menu-btn span {
      position: relative;
      z-index: 1;
      display: block;
      width: 27px;
      height: 4px;
      border-radius: 99px;
      background: #f4f7fa;
      box-shadow: 0 0 5px rgba(235,245,250,.45);
      transition: transform .18s ease, opacity .18s ease;
    }

    .menu-btn.active span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }

    .menu-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn.active span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }

    .menu-btn:active {
      transform: scale(.94);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .action-btn {
      background: #272933;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
    }

    .action-btn:active {
      transform: scale(.97);
    }

    .top-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #22242c;
      border: 1px solid transparent;
      transition: box-shadow .2s ease, border-color .2s ease, transform .15s ease;
    }

    .menu-icon {
      color: #8fd3ff;
      border-color: rgba(143, 211, 255, .28);
      box-shadow: 0 0 7px rgba(143, 211, 255, .12);
    }

    .plus-icon {
      color: #ff9f43;
      border-color: rgba(255, 159, 67, .28);
      box-shadow: 0 0 7px rgba(255, 159, 67, .12);
    }

    .voice-chat-icon {
      color: #78a7ff;
      border-color: rgba(120, 167, 255, .28);
      box-shadow: 0 0 7px rgba(120, 167, 255, .12);
    }

    .top-icon:active {
      box-shadow: none;
    }

    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 16px 130px;
      scroll-padding-top: 18px;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
    }

    .welcome {
      max-width: 700px;
      margin: 55px auto 0;
      text-align: center;
      padding: 20px;
    }

    .robot {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .welcome p {
      margin: 0;
      color: #aeb1bd;
      font-size: 16px;
    }

    .message-row {
      display: flex;
      margin: 10px auto;
      max-width: 850px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.bot {
      justify-content: flex-start;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 16px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .user .message {
      background: #30323d;
      border-bottom-right-radius: 5px;
    }

    .bot .message {
      background: #1b1d24;
      border: 1px solid #292b34;
      border-bottom-left-radius: 5px;
    }

    .message h1,
    .message h2,
    .message h3 {
      margin-top: 5px;
      margin-bottom: 8px;
    }

    .message p {
      margin: 6px 0;
    }

    .message ul,
    .message ol {
      padding-left: 24px;
      margin: 8px 0;
    }

    .message li {
      margin: 4px 0;
    }

    .message strong {
      font-weight: 800;
    }

    .message code {
      background: #111218;
      padding: 2px 5px;
      border-radius: 5px;
    }

    .message pre {
      background: #0b0c10;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .generated-image {
      width: 100%;
      max-width: 620px;
      display: block;
      border-radius: 14px;
      margin-top: 5px;
    }

    .image-caption {
      color: #aeb1bd;
      font-size: 13px;
      margin-top: 8px;
    }

    .typing {
      color: #aeb1bd;
      font-style: italic;
    }

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(
        transparent,
        #0f1014 25%
      );
      padding: 25px 12px 0;
    }

    .mode-label {
      max-width: 850px;
      margin: 0 auto 6px;
      color: #aeb1bd;
      font-size: 13px;
      padding-left: 5px;
      display: none;
    }

    .mode-label.active {
      display: block;
    }

    .composer {
      max-width: 850px;
      margin: auto;
      background: #191a20;
      border: 1px solid #30323b;
      border-radius: 17px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      gap: 7px;
      box-shadow: 0 8px 35px rgba(0,0,0,.35);
    }

    #input {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 130px;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 11px 9px;
      font-size: 16px;
      font-family: inherit;
    }

    #input::placeholder {
      color: #777b88;
    }

    .voice-lang {
      width: 34px;
      height: 34px;
      margin-right: 4px;
      border: 1px solid #3a3d48;
      border-radius: 10px;
      background: #191a20;
      color: #cfd3dc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      cursor: pointer;
      flex: 0 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    .voice-lang:active {
      transform: scale(.94);
    }

    #micButton {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #micButton img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 10px;
    }

    #micButton:active {
      transform: scale(.94);
    }

    #micButton.listening {
      background: rgba(76, 201, 240, .12);
      box-shadow: 0 0 0 2px rgba(76, 201, 240, .35), 0 0 18px rgba(76, 201, 240, .45);
      animation: limitraMicPulse 1.2s ease-in-out infinite;
    }

    @keyframes limitraMicPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    #sendButton {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: #ffffff;
      color: #111218;
      font-size: 19px;
      font-weight: bold;
    }

    #sendButton:disabled {
      opacity: .45;
    }

    .panel {
      position: fixed;
      top: 74px;
      left: 10px;
      width: min(340px, calc(100vw - 20px));
      max-height: 70vh;
      overflow-y: auto;
      background: #191a20;
      border: 1px solid #30323b;
      border-radius: 15px;
      padding: 12px;
      z-index: 20;
      box-shadow: 0 15px 45px rgba(0,0,0,.5);
      display: none;
    }

    .panel.open {
      display: block;
    }

    .panel h3 {
      margin: 5px 5px 12px;
    }

    .history-item {
      background: #24262f;
      padding: 10px;
      border-radius: 10px;
      margin: 6px 0;
      cursor: pointer;
      font-size: 14px;
    }

    .history-item:active {
      transform: scale(.98);
    }

    .empty-history {
      color: #9296a3;
      padding: 10px 5px;
      font-size: 14px;
    }

    .clear-btn {
      width: 100%;
      margin-top: 8px;
      background: #30323d;
      color: white;
      border: 0;
      padding: 10px;
      border-radius: 9px;
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 25px;
      }

      .action-btn {
        padding: 8px 9px;
      }

      .message {
        max-width: 90%;
      }

      #chat {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <button class="menu-btn" id="menuButton" title="Menu" aria-label="Open menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="brand">Limitra AI</div>

    <div class="top-actions">
      <button class="action-btn" id="newChat">New Chat</button>
    </div>

  <main id="chat">
    <div class="welcome" id="welcome">

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("sendButton");
  const micButton = document.getElementById("micButton");
  const newChatButton = document.getElementById("newChat");
  const menuButton = document.getElementById("menuButton");
  const historyPanel = document.getElementById("historyPanel");
  const historyList = document.getElementById("historyList");
  const clearHistory = document.getElementById("clearHistory");
  const modeLabel = document.getElementById("modeLabel");
  const welcome = document.getElementById("welcome");

  let currentChat = [];
  let isBusy = false;

  const MEMORY_KEY = "limitra_ai_memory";
  const OLD_MEMORY_KEY = "pocket_ai_memory";
  const HISTORY_KEY = "limitra_ai_history";
  const OLD_HISTORY_KEY = "pocket_ai_history";
  const CURRENT_CHAT_KEY = "limitra_ai_current_chat";
  const OLD_CURRENT_CHAT_KEY = "pocket_ai_current_chat";

  // One-time migration from the old Limitra AI storage keys.
  // This keeps existing chats/memory instead of deleting them after the rename.
  function migrateOldStorage() {
    const migrations = [
      [OLD_MEMORY_KEY, MEMORY_KEY],
      [OLD_HISTORY_KEY, HISTORY_KEY],
      [OLD_CURRENT_CHAT_KEY, CURRENT_CHAT_KEY]
    ];

    migrations.forEach(([oldKey, newKey]) => {
      if (!localStorage.getItem(newKey) && localStorage.getItem(oldKey)) {
        localStorage.setItem(newKey, localStorage.getItem(oldKey));
      }
    });
  }

  migrateOldStorage();

  function getMemory() {
    try {
      return JSON.parse(localStorage.getItem(MEMORY_KEY) || "{}");
    } catch {
      return {};
    }
  }

  function saveMemory(memory) {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
  }

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function saveHistory(history) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function formatMarkdown(text) {
    let html = escapeHtml(text);

    html = html.replace(
      /```([\s\S]*?)```/g,
      "<pre><code>$1</code></pre>"
    );

    html = html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

    html = html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

    html = html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );

    html = html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

    html = html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

    html = html.replace(
      /^\s*[-*]\s+(.*)$/gm,
      "<li>$1</li>"
    );

    html = html.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );

    html = html.replace(
      /\n\n+/g,
      "</p><p>"
    );

    html = "<p>" + html + "</p>";

    html = html.replace(
      /<p>(<h[1-3]>)/g,
      "$1"
    );

    html = html.replace(
      /(<\/h[1-3]>)<\/p>/g,
      "$1"
    );

    html = html.replace(
      /<p>(<ul>)/g,
      "$1"
    );

    html = html.replace(
      /(<\/ul>)<\/p>/g,
      "$1"
    );

    html = html.replace(
      /<p><pre>/g,
      "<pre>"
    );

    html = html.replace(
      /<\/pre><\/p>/g,
      "</pre>"
    );

    return html;
  }

  function addMessage(role, text, save = true) {
    if (welcome) {
      welcome.style.display = "none";
    }

    const row = document.createElement("div");
    row.className = "message-row " + role;

    const bubble = document.createElement("div");
    bubble.className = "message";

    if (role === "bot") {
      bubble.innerHTML = formatMarkdown(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(bubble);
    chat.appendChild(row);

    if (save) {
      currentChat.push({
        role: role,
        text: text,
        type: "text"
      });

      localStorage.setItem(
        CURRENT_CHAT_KEY,
        JSON.stringify(currentChat)
      );
    }

    chat.scrollTop = chat.scrollHeight;

    return bubble;
  }

  function addImageMessage(prompt, imageElement, save = true) {
    if (welcome) {
      welcome.style.display = "none";
    }

    const row = document.createElement("div");
    row.className = "message-row bot";

    const bubble = document.createElement("div");
    bubble.className = "message";

    const title = document.createElement("div");
    title.innerHTML = "<strong>🎨 Generated Image</strong>";

    imageElement.className = "generated-image";
    imageElement.alt = prompt;

    const caption = document.createElement("div");
    caption.className = "image-caption";
    caption.textContent = prompt;

    bubble.appendChild(title);
    bubble.appendChild(imageElement);
    bubble.appendChild(caption);

    row.appendChild(bubble);
    chat.appendChild(row);

    if (save) {
      currentChat.push({
        role: "bot",
        text: "🎨 Image generated: " + prompt,
        type: "image"
      });

      localStorage.setItem(
        CURRENT_CHAT_KEY,
        JSON.stringify(currentChat)
      );
    }

    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "message-row bot";
    row.id = "typingMessage";

    const bubble = document.createElement("div");
    bubble.className = "message typing";
    bubble.textContent = "Limitra AI is thinking...";

    row.appendChild(bubble);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById("typingMessage");
    if (typing) {
      typing.remove();
    }
  }

  function updateMemoryFromConversation(userText, aiText) {
    const memory = getMemory();

    const combined = (userText + " " + aiText).toLowerCase();

    const nameMatch =
      userText.match(
        /(?:my name is|i am|i'm|call me)\s+([a-zA-Z][a-zA-Z ]{1,30})/i
      );

    if (nameMatch) {
      memory.name = nameMatch[1].trim();
    }

    if (
      combined.includes("my name is paras") ||
      combined.includes("my name is paras dahake")
    ) {
      memory.name = "Paras";
    }

    memory.updatedAt = Date.now();

    saveMemory(memory);
  }

  function buildConversationMessages(userText) {
    const memory = getMemory();

    let systemPrompt =
      "You are Limitra AI, a helpful AI assistant created by Paras Dahake. " +
      "Give clear, useful and friendly answers. " +
      "Match the user's language naturally: English, Hindi, Marathi, " +
      "or mixed language. Do not force one language. " +
      "Use Markdown when it improves readability.";

    if (memory.name) {
      systemPrompt +=
        " The user's remembered name is " +
        memory.name +
        ".";
    }

    const messages = [
      {
        role: "system",
        content: systemPrompt
      }
    ];

    for (const item of currentChat.slice(-12)) {
      if (item.type === "text") {
        messages.push({
          role: item.role === "user" ? "user" : "assistant",
          content: item.text
        });
      }
    }

    messages.push({
      role: "user",
      content: userText
    });

    return messages;
  }

  async function sendChatMessage(prompt) {
    addMessage("user", prompt);
    addTyping();

    try {
      const messages = buildConversationMessages(prompt);

      const response = await puter.ai.chat(messages);

      removeTyping();

      let answer = "";

      if (typeof response === "string") {
        answer = response;
      } else if (response && response.message) {
        if (typeof response.message.content === "string") {
          answer = response.message.content;
        } else if (Array.isArray(response.message.content)) {
          answer = response.message.content
            .map(x => x.text || "")
            .join("");
        }
      }

      if (!answer) {
        answer = "I couldn't generate a response. Please try again.";
      }

      addMessage("bot", answer);

      updateMemoryFromConversation(prompt, answer);

      updateHistory();
    } catch (error) {
      removeTyping();

      addMessage(
        "bot",
        "Sorry, something went wrong while getting the AI response. Please try again."
      );

      console.error(error);
    }
  }

  async function sendMessage() {
    if (isBusy) return;

    const prompt = input.value.trim();

    if (!prompt) return;

    input.value = "";
    input.style.height = "44px";

    isBusy = true;
    sendButton.disabled = true;

    await sendChatMessage(prompt);

    isBusy = false;
    sendButton.disabled = false;
    input.focus();
  }

  function startNewChat() {
    currentChat = [];

    localStorage.removeItem(CURRENT_CHAT_KEY);

    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="robot">🤖</div>
        <h1>Hi, I'm Limitra AI</h1>
        <p>Ask me anything.</p>
      </div>
    `;

    historyPanel.classList.remove("open");
    menuButton.classList.remove("active");
    menuButton.setAttribute("aria-expanded", "false");

    input.focus();
  }

  function saveHistoryItem() {
    if (!currentChat.length) return;

    const firstUserMessage = currentChat.find(
      item => item.role === "user"
    );

    if (!firstUserMessage) return;

    const history = getHistory();

    const item = {
      id: Date.now(),
      title: firstUserMessage.text.slice(0, 60),
      messages: currentChat
    };

    history.unshift(item);

    saveHistory(history.slice(0, 30));
  }

  function updateHistory() {
    const history = getHistory();

    if (currentChat.length) {
      const firstUserMessage = currentChat.find(
        item => item.role === "user"
      );

      if (firstUserMessage) {
        const existingIndex = history.findIndex(
          item =>
            item.messages &&
            item.messages.length &&
            item.messages[0].text === firstUserMessage.text
        );

        const currentItem = {
          id: existingIndex >= 0
            ? history[existingIndex].id
            : Date.now(),
          title: firstUserMessage.text.slice(0, 60),
          messages: currentChat
        };

        if (existingIndex >= 0) {
          history[existingIndex] = currentItem;
        } else {
          history.unshift(currentItem);
        }

        saveHistory(history.slice(0, 30));
      }
    }

    renderHistory();
  }

  function renderHistory() {
    const history = getHistory();

    historyList.innerHTML = "";

    if (!history.length) {
      historyList.innerHTML =
        '<div class="empty-history">No chat history yet.</div>';
      return;
    }

    history.forEach(item => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.textContent = item.title || "Chat";

      div.addEventListener("click", () => {
        loadHistoryItem(item);
        historyPanel.classList.remove("open");
        menuButton.classList.remove("active");
        menuButton.setAttribute("aria-expanded", "false");
      });

      historyList.appendChild(div);
    });
  }

  function loadHistoryItem(item) {
    currentChat = item.messages || [];

    chat.innerHTML = "";

    currentChat.forEach(message => {
      if (message.type === "image") {
        addMessage(
          "bot",
          message.text +
          "\n\nThe generated image is not stored in browser history."
        , false);
      } else {
        addMessage(
          message.role,
          message.text,
          false
        );
      }
    });

    localStorage.setItem(
      CURRENT_CHAT_KEY,
      JSON.stringify(currentChat)
    );

    chat.scrollTop = chat.scrollHeight;
  }

  function loadCurrentChat() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(CURRENT_CHAT_KEY) || "[]"
      );

      if (!Array.isArray(saved) || !saved.length) {
        return;
      }

      currentChat = saved;
      chat.innerHTML = "";

      currentChat.forEach(message => {
        if (message.type === "image") {
          addMessage(
            "bot",
            message.text +
            "\n\nThe generated image is not stored in browser history.",
            false
          );
        } else {
          addMessage(
            message.role,
            message.text,
            false
          );
        }
      });
    } catch {
      currentChat = [];
    }
  }

  sendButton.addEventListener("click", sendMessage);

  // Limitra AI v14 voice input.
  // Hybrid mode:
  // 1) Browser SpeechRecognition shows words LIVE while the user speaks.
  // 2) MediaRecorder captures the same audio.
  // 3) When the user stops, Puter speech2txt performs the high-quality
  //    final transcription and replaces the live draft.
  // This keeps the UI responsive while using a stronger final transcript.
  const voiceLangButton = document.getElementById("voiceLang");
  const voiceLanguages = [
    { code: "en", recognitionCode: "en-IN", label: "EN", name: "English (India)" },
    { code: "hi", recognitionCode: "hi-IN", label: "HI", name: "Hindi (India)" },
    { code: "mr", recognitionCode: "mr-IN", label: "MR", name: "Marathi (India)" }
  ];
  let voiceLangIndex = 0;

  let mediaStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let transcriptionBusy = false;

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let recognition = null;
  let recognitionRestartTimer = null;
  let voiceBaseText = "";
  let liveVoiceText = "";
  let liveInterimText = "";
  let stoppingVoice = false;

  function currentVoiceLanguage() {
    return voiceLanguages[voiceLangIndex];
  }

  function updateVoiceLanguageUI() {
    const lang = currentVoiceLanguage();
    voiceLangButton.textContent = lang.label;
    voiceLangButton.title = "Voice language: " + lang.name;
    voiceLangButton.setAttribute("aria-label", "Voice language: " + lang.name);
  }

  function setMicState(recording, transcribing = false) {
    isRecording = recording;
    transcriptionBusy = transcribing;

    if (recording) {
      micButton.classList.add("listening");
      micButton.title = "Recording… tap to stop";
      micButton.setAttribute("aria-label", "Recording — tap to stop");
    } else if (transcribing) {
      micButton.classList.remove("listening");
      micButton.title = "Transcribing…";
      micButton.setAttribute("aria-label", "Transcribing speech");
    } else {
      micButton.classList.remove("listening");
      micButton.title = "Voice input";
      micButton.setAttribute("aria-label", "Voice input");
    }
  }

  function cleanVoiceText(text) {
    return String(text || "")
      .replace(/[\u200B-\u200D\uFEFF]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function normalizeLimitraTranscript(text) {
    let value = cleanVoiceText(text);
    if (!value) return "";

    value = value.replace(/\b(?:limited|limit(?:ed|ra)?|limit try|limitry|limit\s*ai|limit\s*eye)\s+(?:a\.?i\.?|ai|hi|i)\b/gi, "Limitra AI");
    value = value.replace(/\blimitra\s+(?:hi|i)\b/gi, "Limitra AI");
    value = value.replace(/\b(?:limitra|limited)\s+a\s*i\b/gi, "Limitra AI");

    value = value.replace(
      /\bhello\s+(?:limited|limit(?:ed|ra)?|limit try)\s+can you help me\s+(?:limited|limit(?:ed|ra)?|limit try)\s*(?:ai|hi|i)?\b/gi,
      "Hello, can you help me, Limitra AI?"
    );

    return cleanVoiceText(value);
  }

  function renderLiveVoice() {
    const draft = [voiceBaseText, liveVoiceText, liveInterimText]
      .filter(Boolean)
      .join(" ");
    input.value = cleanVoiceText(draft);
    input.dispatchEvent(new Event("input", { bubbles: true }));
    updateInputSize();
  }

  function chooseMimeType() {
    const choices = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus"
    ];

    for (const type of choices) {
      if (
        window.MediaRecorder &&
        typeof MediaRecorder.isTypeSupported === "function" &&
        MediaRecorder.isTypeSupported(type)
      ) {
        return type;
      }
    }
    return "";
  }

  function cleanupMicrophone() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
  }

  function stopRecognitionForVoice() {
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;

    if (recognition) {
      try { recognition.stop(); } catch (_) {}
    }
  }

  function startLiveRecognition() {
    if (!recognition || !isRecording) return;

    try {
      recognition.lang = currentVoiceLanguage().recognitionCode;
      recognition.start();
    } catch (_) {
      // Android Chromium can throw if start() happens during a restart.
    }
  }

  function setupLiveRecognition() {
    if (!SpeechRecognition) return;

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.lang = currentVoiceLanguage().recognitionCode;

    recognition.onstart = () => {
      if (isRecording) {
        micButton.title = "Listening… tap to stop";
      }
    };

    recognition.onresult = event => {
      if (!isRecording) return;

      let interim = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (!result || !result[0]) continue;

        const piece = cleanVoiceText(result[0].transcript);
        if (!piece) continue;

        if (result.isFinal) {
          liveVoiceText = cleanVoiceText(
            [liveVoiceText, piece].filter(Boolean).join(" ")
          );
        } else {
          interim = piece;
        }
      }

      liveInterimText = interim;
      renderLiveVoice();
    };

    recognition.onerror = event => {
      console.warn("Limitra AI live voice recognition:", event.error);

      // The live recognizer is only a display layer. The MediaRecorder +
      // Puter transcription continues even if browser recognition fails.
      if (isRecording && !stoppingVoice &&
          event.error !== "not-allowed" &&
          event.error !== "service-not-allowed") {
        clearTimeout(recognitionRestartTimer);
        recognitionRestartTimer = setTimeout(() => {
          if (isRecording && !stoppingVoice) startLiveRecognition();
        }, 250);
      }
    };

    recognition.onend = () => {
      if (isRecording && !stoppingVoice) {
        clearTimeout(recognitionRestartTimer);
        recognitionRestartTimer = setTimeout(() => {
          if (isRecording && !stoppingVoice) startLiveRecognition();
        }, 250);
      }
    };
  }

  function audioBufferToWavBlob(audioBuffer) {
    const channels = Math.min(audioBuffer.numberOfChannels || 1, 2);
    const sampleRate = audioBuffer.sampleRate || 44100;
    const frameCount = audioBuffer.length;
    const bytesPerSample = 2;
    const blockAlign = channels * bytesPerSample;
    const dataSize = frameCount * blockAlign;
    const buffer = new ArrayBuffer(44 + dataSize);
    const view = new DataView(buffer);

    const writeString = (offset, value) => {
      for (let i = 0; i < value.length; i++) {
        view.setUint8(offset + i, value.charCodeAt(i));
      }
    };

    writeString(0, "RIFF");
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, "WAVE");
    writeString(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeString(36, "data");
    view.setUint32(40, dataSize, true);

    const channelData = [];
    for (let channel = 0; channel < channels; channel++) {
      channelData.push(audioBuffer.getChannelData(channel));
    }

    let offset = 44;
    for (let i = 0; i < frameCount; i++) {
      for (let channel = 0; channel < channels; channel++) {
        let sample = channelData[channel][i] || 0;
        sample = Math.max(-1, Math.min(1, sample));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
      }
    }

    return new Blob([buffer], { type: "audio/wav" });
  }

  async function makeWavFile(blob) {
    if (!blob || blob.size < 1000) {
      throw new Error("No usable audio was recorded.");
    }

    // MediaRecorder on Android commonly creates WebM/Opus. Puter accepts WAV
    // reliably, so decode the browser recording and send a real .wav File.
    if (!window.AudioContext && !window.webkitAudioContext) {
      return new File([blob], "limitra-voice.webm", {
        type: blob.type || "audio/webm"
      });
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    try {
      const bytes = await blob.arrayBuffer();
      const audioBuffer = await ctx.decodeAudioData(bytes.slice(0));
      const wavBlob = audioBufferToWavBlob(audioBuffer);
      return new File([wavBlob], "limitra-voice.wav", { type: "audio/wav" });
    } finally {
      try { await ctx.close(); } catch (_) {}
    }
  }

  async function transcribeRecordedAudio(blob) {
    const lang = currentVoiceLanguage();
    const prompt =
      "Limitra AI, created by Paras Dahake. Recognize Limitra AI exactly. " +
      "The speaker may use Indian English, Hindi, Marathi, or mixed language. " +
      "Preserve the speaker's wording and do not invent words.";

    const audioFile = await makeWavFile(blob);

    // Use a real File with a supported filename/extension. This avoids the
    // mobile-browser Blob format error seen with the previous version.
    const attempts = [
      () => puter.ai.speech2txt(audioFile, {
        model: "gpt-4o-transcribe",
        language: lang.code,
        prompt
      }),
      () => puter.ai.speech2txt(audioFile, {
        model: "gpt-4o-mini-transcribe",
        prompt
      }),
      () => puter.ai.speech2txt(audioFile, {
        model: "whisper-1",
        prompt
      })
    ];

    let lastError = null;
    for (const attempt of attempts) {
      try {
        const result = await attempt();
        const raw = typeof result === "string"
          ? result
          : (result && (result.text || result.transcript)) || "";
        const transcript = normalizeLimitraTranscript(raw);
        if (transcript) return transcript;
      } catch (error) {
        lastError = error;
        console.warn("Limitra AI STT attempt failed:", error);
      }
    }

    throw lastError || new Error("Speech transcription returned no text.");
  }

  async function finishVoiceRecording(blob, fallbackText) {
    setMicState(false, true);

    try {
      const transcript = await transcribeRecordedAudio(blob);

      if (transcript) {
        input.value = cleanVoiceText(
          [voiceBaseText, transcript].filter(Boolean).join(" ")
        );
      } else if (fallbackText) {
        input.value = cleanVoiceText(
          [voiceBaseText, fallbackText].filter(Boolean).join(" ")
        );
      } else {
        alert("I couldn't hear any clear words. Please try again.");
      }

      input.dispatchEvent(new Event("input", { bubbles: true }));
      updateInputSize();
      input.focus();
    } catch (error) {
      console.error("Limitra AI speech-to-text error:", error);

      // If Puter STT fails, keep the live browser transcript instead of
      // leaving the user with an empty composer.
      if (fallbackText) {
        input.value = cleanVoiceText(
          [voiceBaseText, fallbackText].filter(Boolean).join(" ")
        );
        input.dispatchEvent(new Event("input", { bubbles: true }));
        updateInputSize();
        input.focus();
      } else {
        const detail = error && (error.message || error.msg || error.error || String(error));
        alert("Voice transcription failed. " + detail);
      }
    } finally {
      setMicState(false, false);
      stoppingVoice = false;
    }
  }

  async function startVoiceRecording() {
    if (isRecording || transcriptionBusy) return;

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia ||
      !window.MediaRecorder
    ) {
      alert("This browser does not support voice recording. Please update your browser.");
      return;
    }

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      voiceBaseText = cleanVoiceText(input.value);
      liveVoiceText = "";
      liveInterimText = "";
      recordedChunks = [];
      stoppingVoice = false;

      const mimeType = chooseMimeType();
      mediaRecorder = mimeType
        ? new MediaRecorder(mediaStream, { mimeType })
        : new MediaRecorder(mediaStream);

      mediaRecorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = async () => {
        cleanupMicrophone();

        const type = mediaRecorder && mediaRecorder.mimeType
          ? mediaRecorder.mimeType
          : (mimeType || "audio/webm");

        const blob = new Blob(recordedChunks, { type });
        recordedChunks = [];

        const fallbackText = cleanVoiceText(
          [liveVoiceText, liveInterimText].filter(Boolean).join(" ")
        );

        await finishVoiceRecording(blob, fallbackText);
      };

      mediaRecorder.onerror = event => {
        console.error("MediaRecorder error:", event.error);
        cleanupMicrophone();
        stopRecognitionForVoice();
        setMicState(false, false);
        stoppingVoice = false;
        alert("The microphone recording failed. Please try again.");
      };

      mediaRecorder.start(250);
      setMicState(true, false);

      // Show live words immediately when the browser supports it.
      setupLiveRecognition();
      startLiveRecognition();

    } catch (error) {
      cleanupMicrophone();
      stopRecognitionForVoice();
      setMicState(false, false);
      console.error("Microphone permission error:", error);

      if (error && error.name === "NotAllowedError") {
        alert("Please allow microphone access for Limitra AI.");
      } else {
        alert("Limitra AI could not start the microphone.");
      }
    }
  }

  function stopVoiceRecording() {
    if (!isRecording || stoppingVoice) return;

    stoppingVoice = true;
    stopRecognitionForVoice();

    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    } else {
      cleanupMicrophone();
      setMicState(false, false);
      stoppingVoice = false;
    }
  }

  voiceLangButton.addEventListener("click", () => {
    if (isRecording || transcriptionBusy) return;

    voiceLangIndex = (voiceLangIndex + 1) % voiceLanguages.length;
    updateVoiceLanguageUI();
  });

  micButton.addEventListener("click", () => {
    if (isRecording) {
      stopVoiceRecording();
    } else if (!transcriptionBusy) {
      startVoiceRecording();
    }
  });

  window.addEventListener("pagehide", () => {
    stoppingVoice = true;
    stopRecognitionForVoice();
    cleanupMicrophone();
  });

  updateVoiceLanguageUI();

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "44px";
    input.style.height =
      Math.min(input.scrollHeight, 130) + "px";
  });

  menuButton.addEventListener("click", event => {
    event.stopPropagation();

    const willOpen = !historyPanel.classList.contains("open");
    historyPanel.classList.toggle("open", willOpen);
    menuButton.classList.toggle("active", willOpen);
    menuButton.setAttribute("aria-expanded", String(willOpen));
  });

  newChatButton.addEventListener(
    "click",
    startNewChat
  );

  clearHistory.addEventListener("click", () => {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  });

  document.addEventListener("click", event => {
    if (
      historyPanel.classList.contains("open") &&
      !historyPanel.contains(event.target) &&
      event.target !== menuButton &&
      !menuButton.contains(event.target)
    ) {
      historyPanel.classList.remove("open");
      menuButton.classList.remove("active");
      menuButton.setAttribute("aria-expanded", "false");
    }
  });

  loadCurrentChat();
  renderHistory();
  input.focus();
</script>

</body>
</html>
